name: Deploy to Firebase App Distribution

on:
  push:
    branches:
      - develop

jobs:
  build-and-distribute:
    name: Build APK and Upload to Firebase
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Dar permisos al Gradle wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Crear google-services.json desde el secreto
      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      # 5. Crear local.properties con la API Key de Maps
      - name: Create local.properties
        run: echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" > local.properties

      # 6. Compilar APK de debug
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # 7. Subir a Firebase App Distribution
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: testers
          file: app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: |
            Rama: develop
            Commit: ${{ github.sha }}
            Mensaje: ${{ github.event.head_commit.message }}